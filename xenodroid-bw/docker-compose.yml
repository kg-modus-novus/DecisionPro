services:
  postgres:
    image: postgres:16-alpine
    container_name: decisionpro-xenodroid-bw-pg
    ports:
      - "5042:5432"
    environment:
      POSTGRES_USER: decisionpro
      POSTGRES_PASSWORD: decisionpro_poc_local
      POSTGRES_DB: xenodroid_bw
    volumes:
      - xenodroid_bw_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionpro -d xenodroid_bw"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  xenodroid_bw_pg:
